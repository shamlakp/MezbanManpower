name: hirehub_ui
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.9.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.4
  file_picker: ^5.2.2
  flutter_secure_storage: ^9.0.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.1
  firebase_core: ^3.11.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  flutter_staggered_grid_view: ^0.7.0
  fl_chart: ^1.2.0
  icons_plus: ^5.0.0
  shimmer: ^3.0.0
  lottie: ^3.3.3
  flutter_card_swiper: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/mezban_logo.jpeg
    - assets/images/slider_1.jpg
    - assets/images/slider_2.jpg
    - assets/images/slider_3.jpg

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Relevance
      fonts:
        - asset: assets/fonts/Relevance-Regular.ttf
    - family: Brandink Sans
      fonts:
        - asset: assets/fonts/BrandinkSans-Regular.ttf

